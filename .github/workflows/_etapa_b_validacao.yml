name: Etapa B - validacao

on:
  push:
    branches:
      - refactor/consolidar-patches-restantes-etapa-b-20260916

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Validar estrutura e equivalencia exata dos componentes
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw "VERSION inválida: $version" }
          foreach ($path in @("main.py","interface.py","app.py","automacao.py","config.py","planilha.py","resultados.py","splash.py","atualizacao.py","patch.py","requirements.txt","VERSION","SM AutoLab.ico","assets","version_info_template.txt")) {
            if (-not (Test-Path $path)) { throw "Recurso obrigatório ausente: $path" }
          }
          foreach ($path in @("patch_base.py","patch_arquivos.py","patch_ajustes.py","patch_297.py","patch_298.py","patch_299.py","patch_2991.py","patch_29910.py","patch_ui.py","updater.py")) {
            if (Test-Path $path) { throw "Arquivo obsoleto ainda presente: $path" }
          }
          $main = Get-Content main.py -Raw
          $patch = Get-Content patch.py -Raw
          if ($main -notlike "*from patch import aplicar_patch_ui*") { throw "main.py não integra por patch.py." }
          foreach ($expected in @("ARQUIVOS_COMPONENT_MARKER","AJUSTES_COMPONENT_MARKER","_SOURCE_PATCH_BASE","_SOURCE_PATCH_ARQUIVOS","_SOURCE_PATCH_AJUSTES","_NS_PATCH_BASE","_NS_PATCH_ARQUIVOS","_NS_PATCH_AJUSTES","PATCH_297_MARKER","PATCH_298_MARKER","PATCH_299_MARKER","PATCH_2991_MARKER","PATCH_29910_MARKER","def aplicar_patch_ui")) { if ($patch -notlike "*$expected*") { throw "patch.py não contém: $expected" } }
          if ($patch -like "*Ctrl + clique para selecionar várias datas*") { throw "Instrução visual antiga ainda presente." }

      - name: Verificar equivalência byte a byte dos módulos incorporados
        shell: pwsh
        run: |
          python -c "import patch, subprocess, sys; root='.'; expected=[('patch_base.py',patch._SOURCE_PATCH_BASE),('patch_arquivos.py',patch._SOURCE_PATCH_ARQUIVOS),('patch_ajustes.py',patch._SOURCE_PATCH_AJUSTES)]; [sys.exit('Divergência em '+name) for name,actual in expected if actual != subprocess.check_output(['git','show','45e5075e4b6e04f61505f4eb8928678a95d70f0e:'+name], text=True, encoding='utf-8')]; print('Equivalencia exata dos 3 componentes: OK')"

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sintaxe, testes e integração
        shell: pwsh
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "Falha de compilação sintática." }
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Falha nos testes automatizados." }
          python -c "from interface import App; from patch import aplicar_patch_ui; from main import _validar_base_aplicacao; aplicar_patch_ui(App); _validar_base_aplicacao(); print('Integracao consolidada: OK')"

      - name: Verificar Defender
        shell: pwsh
        run: |
          Start-MpScan -ScanPath (Resolve-Path .) -ScanType CustomScan -ErrorAction Stop
          Start-Sleep -Seconds 5
          $threats = Get-MpThreatDetection
          if ($threats) { $threats | Format-List | Out-Host; throw "Windows Defender detectou ameaça na árvore validada." }
          Write-Host "Windows Defender: nenhuma detecção na árvore de código."
