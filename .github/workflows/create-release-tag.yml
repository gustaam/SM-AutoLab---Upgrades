name: Create release tag after green main

on:
  workflow_run:
    workflows:
      - "Validate main for release"
    types:
      - completed

permissions:
  contents: write

jobs:
  tag:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verificar que a main não mudou
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_sha" != "$VALIDATED_SHA" ]; then
            echo "A main avançou após o CI validado; a tag não será criada."
            exit 0
          fi

      - name: Ler e validar VERSION
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version_b64="$(gh api "repos/${GITHUB_REPOSITORY}/contents/VERSION?ref=${VALIDATED_SHA}" --jq '.content' | tr -d '\n')"
          version="$(printf '%s' "$version_b64" | base64 --decode | tr -d '\r\n')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "VERSION inválida: $version" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version"

      - name: Não sobrescrever tag existente
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          set +e
          response="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --include 2>&1)"
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            echo "A tag ${RELEASE_TAG} já existe; nenhuma alteração será feita."
            exit 0
          fi
          if ! grep -qE 'HTTP/[0-9.]+ 404 ' <<< "$response"; then
            echo "$response" >&2
            exit 1
          fi

      - name: Criar tag exata da main validada
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${RELEASE_TAG}" \
            -f "sha=${VALIDATED_SHA}"
          created_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          if [ "$created_sha" != "$VALIDATED_SHA" ]; then
            echo "A tag criada não aponta para o commit validado." >&2
            exit 1
          fi
          echo "Tag ${RELEASE_TAG} criada apontando para ${VALIDATED_SHA}."
