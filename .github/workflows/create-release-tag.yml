name: Create release tag after green main

on:
  workflow_run:
    workflows:
      - "Validate main for release"
    types:
      - completed

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verificar que a main não mudou
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_sha" != "$VALIDATED_SHA" ]; then
            echo "A main avançou após o CI validado; a tag não será criada."
            exit 0
          fi

      - name: Ler e validar VERSION
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version_b64="$(gh api "repos/${GITHUB_REPOSITORY}/contents/VERSION?ref=${VALIDATED_SHA}" --jq '.content' | tr -d '\n')"
          version="$(printf '%s' "$version_b64" | base64 --decode | tr -d '\r\n')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "VERSION inválida: $version" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version"

      - name: Verificar release publicada
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          set +e
          response="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>&1)"
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            release_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
            if [ -z "$release_commit" ]; then
              echo "Release ${RELEASE_TAG} existe, mas seu commit não pôde ser obtido." >&2
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "A release ${RELEASE_TAG} já está publicada; nenhuma alteração será feita."
            exit 0
          fi
          if [[ "$response" != *'"status":"404"'* && "$response" != *'(HTTP 404)'* ]]; then
            echo "$response" >&2
            exit 1
          fi
          echo "published=false" >> "$GITHUB_OUTPUT"

      - name: Alinhar tag ao commit validado
        id: tag
        if: steps.release.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          set +e
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null)"
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" \
              -f "sha=${VALIDATED_SHA}"
            echo "Tag ${RELEASE_TAG} criada."
          elif [ "$tag_sha" != "$VALIDATED_SHA" ]; then
            echo "Tag existente aponta para $tag_sha; release ainda não publicada, alinhando para $VALIDATED_SHA."
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f "sha=${VALIDATED_SHA}" \
              -F "force=true"
          else
            echo "Tag ${RELEASE_TAG} já aponta para o commit validado."
          fi

          final_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          if [ "$final_sha" != "$VALIDATED_SHA" ]; then
            echo "A tag ${RELEASE_TAG} não aponta para o commit validado." >&2
            exit 1
          fi
          echo "Tag ${RELEASE_TAG} -> ${VALIDATED_SHA}"

      - name: Disparar workflow da release
        if: steps.release.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${RELEASE_TAG}" -f "release_tag=${RELEASE_TAG}"
          echo "Workflow de release disparado para ${RELEASE_TAG}."
