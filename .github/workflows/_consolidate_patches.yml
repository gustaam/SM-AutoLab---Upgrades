name: Consolidar patches de interface

on:
  push:
    branches:
      - refactor/consolidar-patches-ui-20260916

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Consolidar arquivos de patch
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path(".")
          parts = ["patch_297.py", "patch_298.py", "patch_299.py", "patch_2991.py", "patch_29910.py"]
          texts = {name: (root / name).read_text(encoding="utf-8") for name in parts}

          # A instrução visual deve deixar de existir na origem, não apenas ser
          # criada e destruída depois.
          t = texts["patch_297.py"]
          t = re.sub(
              r'\n    # Mantém a janela atual, mas remove o botão manual de seleção\..*?\n    self\._ensure_selection_state\(\)',
              '\n    # Mantém a janela atual com a seleção contextual do calendário.\n    self._ensure_selection_state()',
              t,
              flags=re.S,
          )
          t = re.sub(
              r'\n    ctk\.CTkLabel\(\n        actions, text="Ctrl \+ clique para selecionar várias datas",.*?\n    \)\.pack\(side="left", padx=\(0, 10\)\)\n',
              '\n',
              t,
              flags=re.S,
          )
          texts["patch_297.py"] = t

          t = texts["patch_2991.py"]
          t = re.sub(
              r'\n    for widget in _iter_descendants\(win\):.*?\n    _formatar_selecao_2991\(self\)\n',
              '\n    _formatar_selecao_2991(self)\n',
              t,
              flags=re.S,
          )
          texts["patch_2991.py"] = t

          # Cada patch é carregado em namespace isolado. Assim podemos fundir
          # fisicamente o código sem alterar colisões de nomes entre camadas.
          chunks = [
              'from __future__ import annotations',
              '',
              'from patch_base import aplicar_patch_base',
              'from patch_arquivos import aplicar_patch_arquivos',
              'from patch_ajustes import aplicar_patch_ajustes',
              '',
              'def _load_patch_namespace(name, source):',
              '    namespace = {"__name__": name, "__file__": name}',
              '    exec(compile(source, name, "exec"), namespace)',
              '    return namespace',
              '',
          ]
          for name in parts:
              chunks.append(f'_SOURCE_{name[:-3].upper().replace("-", "_")} = {texts[name]!r}')
              chunks.append(f'_NS_{name[:-3].upper().replace("-", "_")} = _load_patch_namespace("{name}", _SOURCE_{name[:-3].upper().replace("-", "_")})')
              chunks.append('')

          chunks.extend([
              'def aplicar_patch_ui(App):',
              '    """Aplica, em uma única entrada, todas as correções consolidadas da interface."""',
              '    if getattr(App, "_patch_ui_aplicado", False):',
              '        return',
              '',
              '    aplicar_patch_base(App)',
              '    aplicar_patch_arquivos(App)',
              '    aplicar_patch_ajustes(App)',
              '    _NS_PATCH_297["aplicar_patch_297"](App)',
              '    _NS_PATCH_298["aplicar_patch_298"](App)',
              '    _NS_PATCH_299["aplicar_patch_299"](App)',
              '    _NS_PATCH_2991["aplicar_patch_2991"](App)',
              '    _NS_PATCH_29910["aplicar_patch_29910"](App)',
              '    App._patch_ui_aplicado = True',
              '',
          ])
          (root / "patch_ui.py").write_text("\n".join(chunks), encoding="utf-8")

          (root / "main.py").write_text('''from splash import run_splash\nfrom interface import App\nfrom patch_ui import aplicar_patch_ui\n\n_REQUIRED_BASE_METHODS = (\n    "abrir_historico_planilha",\n    "_renderizar_calendario_arquivos",\n    "_toggle_modo_selecao_arquivos",\n    "_toggle_data_selecionada",\n    "_apagar_datas_selecionadas",\n    "_atualizar_contador_selecao",\n    "_contar_codigos_mes",\n)\n\n\ndef _validar_base_aplicacao():\n    """Impede inicializacao silenciosamente incompleta da base do aplicativo."""\n    faltantes = [nome for nome in _REQUIRED_BASE_METHODS if not hasattr(App, nome)]\n    if faltantes:\n        raise RuntimeError(\n            "A base do SM AutoLab esta incompleta. Componentes ausentes: "\n            + ", ".join(faltantes)\n        )\n    if not getattr(App, "_patch_ui_aplicado", False):\n        raise RuntimeError("A camada consolidada de correções não foi aplicada.")\n\n\nif __name__ == "__main__":\n    aplicar_patch_ui(App)\n    _validar_base_aplicacao()\n    run_splash()\n    app = App()\n    app.app.mainloop()\n''', encoding="utf-8")

          # Manifesto enxuto e explícito.
          (root / "INTEGRATION_MANIFEST.txt").write_text('''SM AutoLab — mapa de integração atual\n\npatch_base.py\nCamada-base neutra do aplicativo.\n\npatch_arquivos.py\nCamada neutra de Arquivos/calendário e estado de seleção.\n\npatch_ajustes.py\nAjustes gerais de interface e comportamento.\n\npatch_ui.py\nPonto único de integração das correções históricas de interface. Consolida fisicamente as camadas 2.99.7, 2.99.8, 2.99.9, 2.99.9.1 e 2.99.10, preservando a ordem de aplicação e o comportamento de cada camada.\n\natualizacao.py\nMotor integrado de atualização do próprio executável.\n''', encoding="utf-8")

          # Remove referências arquiteturais antigas da documentação, sem reescrever o restante.
          readme = (root / "README.md").read_text(encoding="utf-8")
          readme = re.sub(r'patch_297\.py|patch_298\.py|patch_299\.py|patch_2991\.py|patch_29910\.py', 'patch_ui.py', readme)
          if 'Arquitetura consolidada' not in readme:
              readme += '\n\n## Arquitetura consolidada\n\nAs correções de interface ficam integradas por `patch_ui.py`. Os módulos `patch_base.py`, `patch_arquivos.py` e `patch_ajustes.py` permanecem separados por serem camadas-base/neutras.\n'
          (root / "README.md").write_text(readme, encoding="utf-8")

          # Testes existentes: o contador continua sendo testado, mas agora via patch_ui.
          test = root / "tests" / "test_patch_29910.py"
          if test.exists():
              content = test.read_text(encoding="utf-8")
              content = content.replace("from patch_29910 import ", "from patch_ui import ")
              test.write_text(content, encoding="utf-8")

          # O teste da janela deixa de depender do texto que não existe mais.
          test_ui = root / "tests" / "test_patch_ui.py"
          if test_ui.exists():
              content = test_ui.read_text(encoding="utf-8")
              content = content.replace("from patch_ui import _remover_instrucao_ctrl_clique", "")
              test_ui.write_text(content, encoding="utf-8")

          # Remove os módulos fisicamente consolidados.
          for name in parts:
              (root / name).unlink(missing_ok=True)

          # Atualiza o workflow de validação para conhecer apenas patch_ui.py.
          wf = root / ".github/workflows/validate-main.yml"
          txt = wf.read_text(encoding="utf-8")
          txt = re.sub(r'"patch_base\.py", "patch_arquivos\.py", "patch_ajustes\.py", "patch_297\.py", "patch_298\.py", "patch_299\.py", "patch_2991\.py", "patch_29910\.py"', '"patch_base.py", "patch_arquivos.py", "patch_ajustes.py", "patch_ui.py"', txt)
          txt = re.sub(r'\n\s*\$patch297 = Get-Content patch_297\.py -Raw\n\s*\$patch298 = Get-Content patch_298\.py -Raw\n\s*\$patch299 = Get-Content patch_299\.py -Raw\n\s*\$patch2991 = Get-Content patch_2991\.py -Raw\n\s*\$patch29910 = Get-Content patch_29910\.py -Raw', '\n          $patchUi = Get-Content patch_ui.py -Raw', txt)
          txt = re.sub(r'\n\s*foreach \(\$expected297.*?\n\s*foreach \(\$expected29910.*?\n', '\n', txt, flags=re.S)
          txt = re.sub(r'\$sourceFiles = @\([^\n]*patch_297\.py[^\n]*\)', lambda m: m.group(0).replace('"patch_297.py", "patch_298.py", "patch_299.py", "patch_2991.py", "patch_29910.py"', '"patch_ui.py"'), txt)
          txt = txt.replace('"from patch_297 import aplicar_patch_297",\n            "from patch_298 import aplicar_patch_298",\n            "from patch_299 import aplicar_patch_299",\n            "from patch_2991 import aplicar_patch_2991",\n            "from patch_29910 import aplicar_patch_29910",', '"from patch_ui import aplicar_patch_ui",')
          txt = txt.replace('$patch297', '$patchUi').replace('$patch298', '$patchUi').replace('$patch299', '$patchUi').replace('$patch2991', '$patchUi').replace('$patch29910', '$patchUi')
          txt = txt.replace('def\s+aplicar_patch_29910', 'def\\s+aplicar_patch_ui')
          if 'Start-MpScan -ScanPath' not in txt:
              txt += '''\n      - name: Verificar Defender\n        shell: pwsh\n        run: |\n          Start-MpScan -ScanPath (Resolve-Path .) -ScanType CustomScan\n          Start-Sleep -Seconds 5\n          $threats = Get-MpThreatDetection\n          if ($threats) { $threats | Format-List | Out-Host; throw "Windows Defender detectou ameaça na árvore validada." }\n'''
          wf.write_text(txt, encoding="utf-8")

          # Release workflow: migra listas/leituras para patch_ui sem alterar o restante do fluxo.
          rwf = root / ".github/workflows/release.yml"
          rtxt = rwf.read_text(encoding="utf-8")
          rtxt = rtxt.replace('"patch_297.py", "patch_298.py", "patch_299.py", "patch_2991.py", "patch_29910.py"', '"patch_ui.py"')
          rtxt = re.sub(r'\n\s*\$patch297 = Get-Content patch_297\.py -Raw.*?\$patch29910 = Get-Content patch_29910\.py -Raw\n', '\n          $patchUi = Get-Content patch_ui.py -Raw\n', rtxt, flags=re.S)
          rtxt = re.sub(r'\n\s*foreach \(\$expected297.*?\n\s*foreach \(\$expected29910.*?\n', '\n', rtxt, flags=re.S)
          rtxt = re.sub(r'\$sourceFiles = @\([^\n]*patch_297\.py[^\n]*\)', lambda m: m.group(0).replace('"patch_297.py", "patch_298.py", "patch_299.py", "patch_2991.py", "patch_29910.py"', '"patch_ui.py"'), rtxt)
          rtxt = re.sub(r'\$patch29(?:7|8|9|91|910)', '$patchUi', rtxt)
          rtxt = rtxt.replace('patch_297.py', 'patch_ui.py').replace('patch_298.py', 'patch_ui.py').replace('patch_299.py', 'patch_ui.py').replace('patch_2991.py', 'patch_ui.py').replace('patch_29910.py', 'patch_ui.py')
          rwf.write_text(rtxt, encoding="utf-8")

          # O texto removido não deve reaparecer como instrução de interface.
          for path in [root / "main.py", root / "interface.py", root / "patch_ui.py", root / "README.md", root / "INTEGRATION_MANIFEST.txt"]:
              text = path.read_text(encoding="utf-8")
              if "Ctrl + clique para selecionar várias datas" in text:
                  raise SystemExit(f"Texto de instrução ainda presente em {path}")

      - name: Commitar consolidação
        shell: bash
        run: |
          git config user.name "SM AutoLab Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidar implementações de interface" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
