name: Migrate integrated update import

on:
  push:
    branches:
      - feature/remover-updater-separado

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Replace legacy module import
        shell: python
        run: |
          from pathlib import Path
          path = Path("interface.py")
          text = path.read_text(encoding="utf-8")
          old = "from updater import find_update, launch_updater"
          new = "from atualizacao import find_update, launch_updater"
          if old not in text:
              raise SystemExit("Importacao esperada nao encontrada em interface.py")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Remove temporary workflow
        run: rm -f .github/workflows/migrate-integrated-import.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interface.py .github/workflows/migrate-integrated-import.yml
          git commit -m "Finaliza remocao do modulo separado de atualizacao"
          git push
