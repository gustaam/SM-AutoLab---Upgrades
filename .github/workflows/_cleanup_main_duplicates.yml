name: One-time cleanup main wrappers

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Consolidar wrapper de config_app
        shell: pwsh
        run: |
          @'
from pathlib import Path
import re
import subprocess

path = Path("main.py")
text = path.read_text(encoding="utf-8")
pattern = re.compile(
    r'    original_config = App\.config_app\n\n'
    r'    def config_wrapper\(self, \*args, \*\*kwargs\):\n'
    r'        result = original_config\(self, \*args, \*\*kwargs\)\n'
    r'        try:\n'
    r'            self\.app\.after_idle\(lambda: _home_counter\(self\)\)\n'
    r'        except Exception:\n'
    r'            _home_counter\(self\)\n'
    r'        return result\n\n'
    r'    App\.config_app = config_wrapper\n\n'
    r'    original_save_exit = App\._planilha_salvar_e_sair\n',
    re.S,
)
replacement = '''    original_config = App.config_app

    def config_wrapper(self, *args, **kwargs):
        result = original_config(self, *args, **kwargs)
        try:
            self.app.after_idle(lambda: _home_counter(self))
        except Exception:
            _home_counter(self)
        try:
            if not getattr(self, "_ui_29912_global_binding", False):
                self.app.bind_all("<Button-1>", lambda event: _global_click(self, event), add="+")
                self._ui_29912_global_binding = True
        except Exception:
            pass
        return result

    App.config_app = config_wrapper

    original_save_exit = App._planilha_salvar_e_sair
'''
text, count = pattern.subn(replacement, text, count=1)
if count != 1:
    raise SystemExit(f"Bloco inicial esperado não encontrado: {count}")

pattern2 = re.compile(
    r'\n    original_global_config = App\.config_app\n\n'
    r'    def global_config_wrapper\(self, \*args, \*\*kwargs\):\n'
    r'        result = original_global_config\(self, \*args, \*\*kwargs\)\n'
    r'        try:\n'
    r'            if not getattr\(self, "_ui_29912_global_binding", False\):\n'
    r'                self\.app\.bind_all\("<Button-1>", lambda event: _global_click\(self, event\), add="\+"\)\n'
    r'                self\._ui_29912_global_binding = True\n'
    r'        except Exception:\n'
    r'            pass\n'
    r'        return result\n\n'
    r'    App\.config_app = global_config_wrapper\n',
    re.S,
)
text, count = pattern2.subn("\n", text, count=1)
if count != 1:
    raise SystemExit(f"Bloco final duplicado não encontrado: {count}")

path.write_text(text, encoding="utf-8")
subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
subprocess.run(["git", "add", "main.py"], check=True)
subprocess.run(["git", "rm", ".github/workflows/_cleanup_main_duplicates.yml"], check=True)
subprocess.run(["git", "commit", "-m", "Consolidar wrapper duplicado de config_app"], check=True)
subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
'@ | python