name: Corrigir entrada consolidada da Etapa B

on:
  push:
    branches:
      - refactor/consolidar-patches-restantes-etapa-b-20260916

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir patch.py
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('patch.py')
          s = p.read_text(encoding='utf-8')
          s2 = re.sub(r'^from patch_base import aplicar_patch_base\nfrom patch_arquivos import aplicar_patch_arquivos\nfrom patch_ajustes import aplicar_patch_ajustes\n\n', '', s, count=1)
          if s2 == s:
              print('Imports antigos já ausentes; nenhuma alteração necessária.')
          else:
              p.write_text(s2, encoding='utf-8')
              print('Imports antigos removidos de patch.py.')

      - name: Validar integração antes do commit
        shell: pwsh
        run: |
          if (Test-Path patch_base.py) { throw 'patch_base.py ainda existe' }
          if (Test-Path patch_arquivos.py) { throw 'patch_arquivos.py ainda existe' }
          if (Test-Path patch_ajustes.py) { throw 'patch_ajustes.py ainda existe' }
          python -m compileall -q patch.py
          if ($LASTEXITCODE -ne 0) { throw 'Falha de sintaxe em patch.py' }

      - name: Commitar correção
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patch.py
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Corrigir imports na entrada consolidada'
            git push origin HEAD:${{ github.ref_name }}
          } else {
            Write-Host 'Nenhuma alteração necessária.'
          }
