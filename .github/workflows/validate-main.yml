name: Validate main for release

# CI trigger validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.7"

      - name: Validar versão e arquitetura consolidada
        shell: pwsh
        run: |
          python scripts/validate.py all
          if ($LASTEXITCODE -ne 0) { throw "Falha na validação consolidada." }

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validar sintaxe, testes e integração
        shell: pwsh
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "Falha de compilação sintática." }
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Falha nos testes automatizados." }
          python -c "from interface import App; from main import install_ui, _validar_base_aplicacao; install_ui(App); _validar_base_aplicacao(); print('Integracao consolidada: OK')"

      - name: Verificar Defender
        shell: pwsh
        run: |
          Start-MpScan -ScanPath (Resolve-Path .) -ScanType CustomScan -ErrorAction Stop
          Start-Sleep -Seconds 5
          $threats = Get-MpThreatDetection
          if ($threats) { $threats | Format-List | Out-Host; throw "Windows Defender detectou ameaça na árvore validada." }
          Write-Host "Windows Defender: nenhuma detecção na árvore de código."
  tag:
    needs: validate
    if: >-
      ${{ needs.validate.result == 'success' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write

    steps:
      - name: Verificar que a main não mudou
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_sha" != "$VALIDATED_SHA" ]; then
            echo "A main avançou após a validação; a tag não será criada."
            exit 0
          fi

      - name: Ler e validar VERSION
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version_b64="$(gh api "repos/${GITHUB_REPOSITORY}/contents/VERSION?ref=${VALIDATED_SHA}" --jq '.content' | tr -d '\n')"
          version="$(printf '%s' "$version_b64" | base64 --decode | tr -d '\r\n')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "VERSION inválida: $version" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version"

      - name: Verificar release publicada
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          set +e
          response="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>&1)"
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            release_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
            if [ -z "$release_commit" ]; then
              echo "Release ${RELEASE_TAG} existe, mas seu commit não pôde ser obtido." >&2
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "A release ${RELEASE_TAG} já está publicada; nenhuma alteração será feita."
            exit 0
          fi
          if [[ "$response" != *'"status":"404"'* && "$response" != *'(HTTP 404)'* ]]; then
            echo "$response" >&2
            exit 1
          fi
          echo "published=false" >> "$GITHUB_OUTPUT"

      - name: Alinhar tag ao commit validado
        if: steps.release.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          set +e
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null)"
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" \
              -f "sha=${VALIDATED_SHA}"
            echo "Tag ${RELEASE_TAG} criada."
          elif [ "$tag_sha" != "$VALIDATED_SHA" ]; then
            echo "Tag existente aponta para $tag_sha; release ainda não publicada, alinhando para ${VALIDATED_SHA}."
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f "sha=${VALIDATED_SHA}" \
              -F "force=true"
          else
            echo "Tag ${RELEASE_TAG} já aponta para o commit validado."
          fi

          final_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          if [ "$final_sha" != "$VALIDATED_SHA" ]; then
            echo "A tag ${RELEASE_TAG} não aponta para o commit validado." >&2
            exit 1
          fi
          echo "Tag ${RELEASE_TAG} -> ${VALIDATED_SHA}"

      - name: Disparar workflow da release
        if: steps.release.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${RELEASE_TAG}" -f "release_tag=${RELEASE_TAG}"
          echo "Workflow de release disparado para ${RELEASE_TAG}."
