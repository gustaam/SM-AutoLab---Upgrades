name: Validate main for release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Consolidar wrapper duplicado em main.py
        shell: pwsh
        run: |
          @'
from pathlib import Path

path = Path("main.py")
text = path.read_text(encoding="utf-8")
start = text.find("    original_config = App.config_app\n")
end = text.find("\n\n_REQUIRED_BASE_METHODS = (", start)
if start < 0 or end < 0:
    raise SystemExit("Bloco de wrappers de config_app não encontrado.")
old = text[start:end]
new = '''    original_config = App.config_app

    def config_wrapper(self, *args, **kwargs):
        result = original_config(self, *args, **kwargs)
        try:
            self.app.after_idle(lambda: _home_counter(self))
        except Exception:
            _home_counter(self)
        try:
            if not getattr(self, "_ui_29912_global_binding", False):
                self.app.bind_all("<Button-1>", lambda event: _global_click(self, event), add="+")
                self._ui_29912_global_binding = True
        except Exception:
            pass
        return result

    App.config_app = config_wrapper

    original_save_exit = App._planilha_salvar_e_sair

    def save_exit_wrapper(self, *args, **kwargs):
        result = original_save_exit(self, *args, **kwargs)
        try:
            self.app.after_idle(lambda: _home_counter(self))
        except Exception:
            _home_counter(self)
        return result

    App._planilha_salvar_e_sair = save_exit_wrapper

    original_save_start = getattr(App, "_planilha_salvar_e_iniciar", None)
    if original_save_start is not None:
        def save_start_wrapper(self, *args, **kwargs):
            result = original_save_start(self, *args, **kwargs)
            try:
                self.app.after_idle(lambda: _home_counter(self))
            except Exception:
                _home_counter(self)
            return result
        App._planilha_salvar_e_iniciar = save_start_wrapper

    App._criar_pasta_historico = _create_history_tile
    App._ui_29912_original_restore = App._restaurar_historico_na_tela
    App._restaurar_historico_na_tela = _restore_history
    App._clique_calendario_arquivos = _calendar_click
    App._atualizar_contador_principal_29912 = _home_counter

    original_render = App._renderizar_calendario_arquivos

    def render_calendar_wrapper(self, *args, **kwargs):
        result = original_render(self, *args, **kwargs)
        _bind_calendar_controls(self)
        return result

    App._renderizar_calendario_arquivos = render_calendar_wrapper
'''
if old == new:
    raise SystemExit(0)
path.write_text(text[:start] + new + text[end:], encoding="utf-8")
PY

git config user.name "github-actions[bot]"
git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
git add -- main.py
git diff --cached --quiet
if ($LASTEXITCODE -eq 0) { Write-Host "main.py já está consolidado; nenhum commit necessário."; exit 0 }
git commit -m "Consolidar wrapper duplicado de config_app"
git push origin HEAD:main

      - name: Validar versão, estrutura e arquitetura consolidada
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw "VERSION inválida: $version" }

          $required = @(
            "main.py", "interface.py", "app.py", "automacao.py", "config.py", "atualizacao.py",
            "patch.py", "requirements.txt", "VERSION", "SM AutoLab.ico", "assets", "version_info_template.txt"
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Recurso obrigatório ausente: $path" } }
          foreach ($obsoletePath in @("ui_fixes_29912.py", "planilha.py", "resultados.py", "splash.py", "patch_base.py", "patch_arquivos.py", "patch_ajustes.py", "patch_v266.py", "patch_v267.py", "patch_v266_new.py", "updater.py", "patch_297.py", "patch_298.py", "patch_299.py", "patch_2991.py", "patch_29910.py", "patch_ui.py", ".etapa-b-trigger", ".github/workflows/_fix_patch_b_import.yml")) {
            if (Test-Path $obsoletePath) { throw "Arquivo/artefato obsoleto ainda presente: $obsoletePath" }
          }

          $main = Get-Content main.py -Raw
          $patch = Get-Content patch.py -Raw
          $interface = Get-Content interface.py -Raw
          $app = Get-Content app.py -Raw
          $atualizacao = Get-Content atualizacao.py -Raw
          $config = Get-Content config.py -Raw
          $build = Get-Content build_windows.bat -Raw
          if ($main -notlike "*from patch import aplicar_patch_ui*") { throw "main.py não usa patch.py como integração única." }
          if ($main -like "*from ui_fixes_29912 import*") { throw "main.py ainda referencia o módulo UI removido." }
          if ($main -notlike "*def install_ui_29912*") { throw "main.py não contém as correções finais de UI consolidadas." }
          if ($main -notlike "*class StartupSplash*") { throw "main.py não contém o splash consolidado." }
          if ($main -notlike "*def _corrigir_historico_ilimitado*") { throw "main.py perdeu a correção de histórico ilimitado." }
          if ($app -notlike "*class Resultados*") { throw "app.py não contém o módulo consolidado de resultados." }
          if ($app -notlike "*def carregar_codigos*") { throw "app.py não contém o leitor de planilhas consolidado." }
          foreach ($expectedPatch in @(
            "ARQUIVOS_COMPONENT_MARKER", "AJUSTES_COMPONENT_MARKER", "_SOURCE_PATCH_BASE", "_SOURCE_PATCH_ARQUIVOS", "_SOURCE_PATCH_AJUSTES",
            "_NS_PATCH_BASE", "_NS_PATCH_ARQUIVOS", "_NS_PATCH_AJUSTES",
            "PATCH_297_MARKER", "PATCH_298_MARKER", "PATCH_299_MARKER", "PATCH_2991_MARKER", "PATCH_29910_MARKER",
            "_historico_tem_erro", "_history_rebind_open_299", "_history_click_outside_299", "_instalar_deselecao_global_299",
            "_planilha_selecionar_tudo_2991", "_planilha_copiar_2991", "_planilha_arrastar_selecao_2991", "_planilha_iniciar_digitacao_2991",
            "_count_saved_passwords", "firstweekday", "_atualizar_contador_selecao_29910", "_ensure_selection_state_29910", "def aplicar_patch_ui"
          )) { if ($patch -notlike "*$expectedPatch*") { throw "patch.py não contém: $expectedPatch" } }
          foreach ($expectedMainUi in @(
            "SM_AUTOLAB_UI_FIXES_29912", "_home_counter", "_calendar_click", "_create_history_tile", "_select_history_tile", "def install_ui_29912"
          )) { if ($main -notlike "*$expectedMainUi*") { throw "main.py não contém: $expectedMainUi" } }
          foreach ($legacyImport in @("from patch_base import", "from patch_arquivos import", "from patch_ajustes import", "from patch_297 import", "from patch_298 import", "from patch_299 import", "from patch_2991 import", "from patch_29910 import", "from patch_ui import", "from planilha import", "from resultados import", "from splash import", "from ui_fixes_29912 import")) {
            if ($main -like "*$legacyImport*" -or $interface -like "*$legacyImport*" -or $app -like "*$legacyImport*" -or $atualizacao -like "*$legacyImport*" -or $build -like "*$legacyImport*") { throw "Import legado detectado: $legacyImport" }
          }
          if ($patch -like "*Ctrl + clique para selecionar várias datas*") { throw "Instrução visual antiga ainda presente em patch.py." }
          if ($interface -match "tkcalendar") { throw "Dependência tkcalendar detectada." }
          if ($interface -notlike "*from atualizacao import find_update, launch_updater*") { throw "Atualizador integrado não encontrado." }
          if ($atualizacao -match 'SM[ ._]?AutoLab[ ._-]?Updater\.exe|updater\.py|--sm-autolab-updater|--sm-autolab-update-helper') { throw "Atualizador separado/modo auxiliar antigo detectado." }
          if ($config -notmatch 'DEFAULT_PORTAL_USUARIO\s*=\s*""') { throw "Usuário padrão não está vazio em config.py." }
          if ($config -notmatch 'DEFAULT_PORTAL_SENHA\s*=\s*""') { throw "Senha padrão não está vazia em config.py." }
          if ($interface -match '"PORTAL_USUARIO"\s*:\s*"[^"\r\n]+"' -or $interface -match '"PORTAL_SENHA"\s*:\s*"[^"\r\n]+"') { throw "Valor de acesso literal encontrado em interface.py." }
          foreach ($legacyPath in @("patch_base.py", "patch_arquivos.py", "patch_ajustes.py", "patch_297.py", "patch_298.py", "patch_299.py", "patch_2991.py", "patch_29910.py", "patch_ui.py", "planilha.py", "resultados.py", "splash.py", "ui_fixes_29912.py")) {
            if ($build -like "*$legacyPath*") { throw "build_windows.bat ainda referencia arquivo legado: $legacyPath" }
          }
          if ($build -notlike "*SM AutoLab*") { throw "build_windows.bat não contém a rotina de build do SM AutoLab." }
          if ($build -notlike "*from interface import App; from patch import aplicar_patch_ui*") { throw "build_windows.bat não usa a integração consolidada." }

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxe, testes e integração
        shell: pwsh
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "Falha de compilação sintática." }
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Falha nos testes automatizados." }
          python -c "from interface import App; from patch import aplicar_patch_ui; from main import _corrigir_historico_ilimitado, _validar_base_aplicacao, install_ui_29912; aplicar_patch_ui(App); _corrigir_historico_ilimitado(); install_ui_29912(App); _validar_base_aplicacao(); print('Integracao consolidada: OK')"

      - name: Verificar Defender
        shell: pwsh
        run: |
          Start-MpScan -ScanPath (Resolve-Path .) -ScanType CustomScan -ErrorAction Stop
          Start-Sleep -Seconds 5
          $threats = Get-MpThreatDetection
          if ($threats) { $threats | Format-List | Out-Host; throw "Windows Defender detectou ameaça na árvore validada." }
          Write-Host "Windows Defender: nenhuma detecção na árvore de código."
