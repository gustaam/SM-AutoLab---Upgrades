name: Consolidate UI layer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Consolidar UI no patch.py
        if: ${{ hashFiles('ui_fixes_29912.py') != '' }}
        shell: pwsh
        run: |
          @'
from pathlib import Path
import subprocess

root=Path('.')
ui=root/'ui_fixes_29912.py'
if not ui.exists():
    raise SystemExit(0)
patch_path=root/'patch.py'
patch=patch_path.read_text(encoding='utf-8')
ui_source=ui.read_text(encoding='utf-8')
marker='\n# Componentes originalmente separados:'
if '_SOURCE_UI_FIXES_29912' not in patch:
    block=(
        '\n# Correções finais de UI consolidadas, preservadas em namespace próprio.\n'
        '_SOURCE_UI_FIXES_29912 = '+repr(ui_source)+'\n'
        '_NS_UI_FIXES_29912 = _load_patch_namespace("ui_fixes_29912.py", _SOURCE_UI_FIXES_29912)\n'
        'install_ui_29912 = _NS_UI_FIXES_29912["install"]\n'
    )
    if marker not in patch:
        raise RuntimeError('Ponto de inserção não encontrado em patch.py')
    patch_path.write_text(patch.replace(marker,block+marker,1),encoding='utf-8')

main_path=root/'main.py'
main=main_path.read_text(encoding='utf-8')
old='from patch import aplicar_patch_ui\nfrom ui_fixes_29912 import install as install_ui_29912'
if old not in main:
    raise RuntimeError('Import antigo não encontrado em main.py')
main_path.write_text(main.replace(old,'from patch import aplicar_patch_ui, install_ui_29912',1),encoding='utf-8')

tp_path=root/'tests/test_patch.py'
tp=tp_path.read_text(encoding='utf-8')
tp=tp.replace('ui = (root / "ui_fixes_29912.py").read_text(encoding="utf-8")','patch = (root / "patch.py").read_text(encoding="utf-8")',1)
tp=tp.replace('self.assertIn("from ui_fixes_29912 import install as install_ui_29912", main)','self.assertIn("from patch import aplicar_patch_ui, install_ui_29912", main)',1)
tp=tp.replace('            "SM_AUTOLAB_UI_FIXES_29912",\n            "_home_counter",\n            "_calendar_click",\n            "_create_history_tile",\n            "_select_history_tile",\n            "def install(App)",\n        ):\n            self.assertIn(marker, ui)','            "_SOURCE_UI_FIXES_29912",\n            "SM_AUTOLAB_UI_FIXES_29912",\n            "_home_counter",\n            "_calendar_click",\n            "_create_history_tile",\n            "_select_history_tile",\n            "def install(App)",\n        ):\n            self.assertIn(marker, patch)',1)
tp_path.write_text(tp,encoding='utf-8')

tui_path=root/'tests/test_ui_correcoes_29912.py'
tui=tui_path.read_text(encoding='utf-8')
old_line='from ui_fixes_29912 import _calendar_click, _ctrl_pressed, _home_counter, _select_history_tile'
new_lines='from patch import _NS_UI_FIXES_29912\n\n_calendar_click = _NS_UI_FIXES_29912["_calendar_click"]\n_ctrl_pressed = _NS_UI_FIXES_29912["_ctrl_pressed"]\n_home_counter = _NS_UI_FIXES_29912["_home_counter"]\n_select_history_tile = _NS_UI_FIXES_29912["_select_history_tile"]'
if old_line not in tui:
    raise RuntimeError('Import antigo não encontrado no teste UI')
tui_path.write_text(tui.replace(old_line,new_lines,1),encoding='utf-8')

for name in ('.github/workflows/validate-main.yml','.github/workflows/release.yml'):
    p=root/name
    text=p.read_text(encoding='utf-8')
    text=text.replace('"patch.py", "ui_fixes_29912.py", "requirements.txt"','"patch.py", "requirements.txt"')
    text=text.replace('"planilha.py", "resultados.py", "splash.py", "patch_base.py"','"planilha.py", "resultados.py", "splash.py", "ui_fixes_29912.py", "patch_base.py"')
    text=text.replace('from ui_fixes_29912 import install as install_ui_29912','from patch import aplicar_patch_ui, install_ui_29912')
    p.write_text(text,encoding='utf-8')

readme=root/'README.md'
r=readme.read_text(encoding='utf-8')
r=r.replace('A camada de correções específicas da versão 2.99.12 continua em `ui_fixes_29912.py` enquanto não forem incorporadas definitivamente à camada consolidada de `patch.py`.','A camada de correções específicas da UI foi incorporada ao `patch.py` em namespace próprio, mantendo a ordem e o ponto de aplicação sem deixar um módulo separado.')
readme.write_text(r,encoding='utf-8')

ui.unlink()
subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
subprocess.run(['git','add','.'],check=True)
if subprocess.run(['git','diff','--cached','--quiet']).returncode:
    raise SystemExit(0)
subprocess.run(['git','commit','-m','Consolidar correções finais de UI no patch.py'],check=True)
subprocess.run(['git','push','origin','HEAD:refactor/consolidar-ui-patch'],check=True)
'@ | python
