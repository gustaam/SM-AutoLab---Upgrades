name: Consolidate UI layer

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Consolidar correções finais de UI
        shell: pwsh
        run: |
          @'
from pathlib import Path
import subprocess

root = Path('.')
ui = root / 'ui_fixes_29912.py'
if not ui.exists():
    print('Camada UI já consolidada; nada a fazer.')
    raise SystemExit(0)

patch_path = root / 'patch.py'
patch = patch_path.read_text(encoding='utf-8')
ui_source = ui.read_text(encoding='utf-8')
marker = '\n# Componentes originalmente separados:'
if '_SOURCE_UI_FIXES_29912' not in patch:
    block = (
        '\n# Correções finais de UI consolidadas, preservadas em namespace próprio.\n'
        '_SOURCE_UI_FIXES_29912 = ' + repr(ui_source) + '\n'
        '_NS_UI_FIXES_29912 = _load_patch_namespace("ui_fixes_29912.py", _SOURCE_UI_FIXES_29912)\n'
        'install_ui_29912 = _NS_UI_FIXES_29912["install"]\n'
    )
    if marker not in patch:
        raise RuntimeError('Ponto de inserção não encontrado em patch.py.')
    patch_path.write_text(patch.replace(marker, block + marker, 1), encoding='utf-8')

main_path = root / 'main.py'
main = main_path.read_text(encoding='utf-8')
old = 'from patch import aplicar_patch_ui\nfrom ui_fixes_29912 import install as install_ui_29912'
if old not in main:
    raise RuntimeError('Import antigo da UI não encontrado em main.py.')
main_path.write_text(main.replace(old, 'from patch import aplicar_patch_ui, install_ui_29912', 1), encoding='utf-8')

tp = root / 'tests' / 'test_patch.py'
text = tp.read_text(encoding='utf-8')
text = text.replace('ui = (root / "ui_fixes_29912.py").read_text(encoding="utf-8")', 'patch = (root / "patch.py").read_text(encoding="utf-8")', 1)
text = text.replace('self.assertIn("from ui_fixes_29912 import install as install_ui_29912", main)', 'self.assertFalse((root / "ui_fixes_29912.py").exists())\n        self.assertIn("from patch import aplicar_patch_ui, install_ui_29912", main)', 1)
text = text.replace('            "SM_AUTOLAB_UI_FIXES_29912",\n            "_home_counter",\n            "_calendar_click",\n            "_create_history_tile",\n            "_select_history_tile",\n            "def install(App)",\n        ):\n            self.assertIn(marker, ui)', '            "_SOURCE_UI_FIXES_29912",\n            "SM_AUTOLAB_UI_FIXES_29912",\n            "_home_counter",\n            "_calendar_click",\n            "_create_history_tile",\n            "_select_history_tile",\n            "def install(App)",\n        ):\n            self.assertIn(marker, patch)', 1)
tp.write_text(text, encoding='utf-8')

tui = root / 'tests' / 'test_ui_correcoes_29912.py'
text = tui.read_text(encoding='utf-8')
old_import = 'from ui_fixes_29912 import _calendar_click, _ctrl_pressed, _home_counter, _select_history_tile'
new_import = 'from patch import _NS_UI_FIXES_29912\n\n_calendar_click = _NS_UI_FIXES_29912["_calendar_click"]\n_ctrl_pressed = _NS_UI_FIXES_29912["_ctrl_pressed"]\n_home_counter = _NS_UI_FIXES_29912["_home_counter"]\n_select_history_tile = _NS_UI_FIXES_29912["_select_history_tile"]'
if old_import not in text:
    raise RuntimeError('Import antigo não encontrado no teste UI.')
tui.write_text(text.replace(old_import, new_import, 1), encoding='utf-8')

# O workflow de release mantém a mesma arquitetura, sem exigir o módulo removido.
release = root / '.github' / 'workflows' / 'release.yml'
text = release.read_text(encoding='utf-8')
text = text.replace('"patch.py", "ui_fixes_29912.py", "requirements.txt"', '"patch.py", "requirements.txt"')
text = text.replace('"planilha.py", "resultados.py", "splash.py", "patch_base.py"', '"planilha.py", "resultados.py", "splash.py", "ui_fixes_29912.py", "patch_base.py"')
text = text.replace('from ui_fixes_29912 import install as install_ui_29912', 'from patch import aplicar_patch_ui, install_ui_29912')
release.write_text(text, encoding='utf-8')

readme = root / 'README.md'
text = readme.read_text(encoding='utf-8')
text = text.replace('A camada de correções específicas da versão 2.99.12 continua em `ui_fixes_29912.py` enquanto não forem incorporadas definitivamente à camada consolidada de `patch.py`.', 'A camada de correções específicas da UI foi incorporada ao `patch.py` em namespace próprio, mantendo a ordem e o ponto de aplicação sem deixar um módulo separado.')
readme.write_text(text, encoding='utf-8')

ui.unlink()
subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
subprocess.run(['git', 'add', '.'], check=True)
if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode == 0:
    print('Nenhuma alteração a commitar.')
    raise SystemExit(0)
subprocess.run(['git', 'commit', '-m', 'Consolidar correções finais de UI no patch.py'], check=True)
subprocess.run(['git', 'push', 'origin', 'main'], check=True)
'@ | python
