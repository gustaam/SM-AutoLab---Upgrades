name: Validate main for release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Validar versão, estrutura e referências legadas
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION deve usar o formato X.Y.Z; valor encontrado: $version" }

          $required = @(
            "main.py", "interface.py", "app.py", "automacao.py", "config.py",
            "planilha.py", "resultados.py", "splash.py", "atualizacao.py",
            "patch_base.py", "patch_arquivos.py", "patch_ajustes.py",
            "requirements.txt", "VERSION", "SM AutoLab.ico", "assets", "version_info_template.txt"
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Arquivo/recurso obrigatório ausente: $path" } }
          foreach ($legacyPath in @("patch_v266.py", "patch_v267.py", "patch_v266_new.py", "updater.py")) {
            if (Test-Path $legacyPath) { throw "Arquivo legado/componente separado não deve fazer parte da base atual: $legacyPath" }
          }

          $main = Get-Content main.py -Raw
          $interface = Get-Content interface.py -Raw
          $base = Get-Content patch_base.py -Raw
          $arquivos = Get-Content patch_arquivos.py -Raw
          $ajustes = Get-Content patch_ajustes.py -Raw
          $atualizacao = Get-Content atualizacao.py -Raw
          $releaseWorkflow = Get-Content .github/workflows/release.yml -Raw

          foreach ($expected in @(
            "from patch_base import aplicar_patch_base",
            "from patch_arquivos import aplicar_patch_arquivos",
            "from patch_ajustes import aplicar_patch_ajustes",
            "_validar_base_aplicacao"
          )) { if ($main -notlike "*$expected*") { throw "main.py não contém a integração obrigatória: $expected" } }
          if ($main -match "--sm-autolab-update-helper") { throw "Modo auxiliar do executável ainda presente em main.py." }
          if ($interface -notmatch "Canvas\(") { throw "interface.py não contém o calendário Canvas esperado." }
          if ($interface -match "tkcalendar") { throw "Dependência tkcalendar detectada." }
          if ($interface -notlike "*from atualizacao import find_update, launch_updater*") { throw "interface.py não usa o módulo integrado de atualização." }
          if ($base -notmatch "def\s+aplicar_patch_base\s*\(") { throw "patch_base.py não expõe a camada-base neutra." }
          if ($arquivos -notmatch "def\s+aplicar_patch_arquivos\s*\(") { throw "patch_arquivos.py não expõe a camada neutra de Arquivos." }
          if ($ajustes -notmatch "def\s+aplicar_patch_ajustes\s*\(") { throw "patch_ajustes.py não expõe a camada de ajustes." }
          foreach ($marker in @("_toggle_modo_selecao_arquivos", "_toggle_data_selecionada", "_apagar_datas_selecionadas", "_atualizar_contador_selecao")) {
            if ($arquivos -notlike "*$marker*") { throw "patch_arquivos.py não expõe o componente obrigatório: $marker" }
          }
          if ($arquivos -notlike "*_contar_codigos_mes_arquivos*") { throw "patch_arquivos.py não expõe o contador mensal obrigatório." }
          if ($atualizacao -notmatch "def\s+find_update\s*\(" -or $atualizacao -notmatch "def\s+launch_updater\s*\(") { throw "atualizacao.py não expõe o motor integrado de atualização." }
          if ($atualizacao -match 'SM[ ._]?AutoLab[ ._-]?Updater\.exe|updater\.py|--sm-autolab-updater|--sm-autolab-update-helper') { throw "Referência ao componente separado/modo auxiliar antigo detectada em atualizacao.py." }

          foreach ($expectedBuild in @("pyinstaller==6.22.2", "--noupx", "--version-file", "Start-MpScan -ScanPath")) {
            if ($releaseWorkflow -notlike "*$expectedBuild*") { throw "release.yml não contém a proteção obrigatória do build: $expectedBuild" }
          }
          if ((Get-Content version_info_template.txt -Raw) -notlike "*__VERSION__*") { throw "version_info_template.txt está sem o marcador de versão." }
          if ((Get-Content version_info_template.txt -Raw) -notlike "*SM AutoLab.exe*") { throw "version_info_template.txt está sem o nome do executável." }

          $retiredTokens = @("patch_v266.py", "patch_v267.py", "v2.85", "v2.86", "v2.87", "v2.88", "v2.89", "v2.90", "v2.91", "v2.92", "v2.93", "v2.94", "v2.95", "v2.96", "v2.97")
          $sourceFiles = @("main.py", "interface.py", "atualizacao.py", "patch_base.py", "patch_arquivos.py", "patch_ajustes.py", "build_windows.bat", "README.md", "INTEGRATION_MANIFEST.txt")
          foreach ($sourcePath in $sourceFiles) {
            if (-not (Test-Path $sourcePath)) { continue }
            $source = Get-Content $sourcePath -Raw
            foreach ($token in $retiredTokens) { if ($source.Contains($token)) { throw "Referência de versão/módulo aposentado detectada em ${sourcePath}: $token" } }
          }
      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validar sintaxe e integração das camadas
        shell: pwsh
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "Falha na compilação sintática dos arquivos Python." }
          python -c "from interface import App; from patch_base import aplicar_patch_base; from patch_arquivos import aplicar_patch_arquivos; from patch_ajustes import aplicar_patch_ajustes; from main import _validar_base_aplicacao; aplicar_patch_base(App); aplicar_patch_arquivos(App); aplicar_patch_ajustes(App); _validar_base_aplicacao(); print('Integracao da main: OK')"
