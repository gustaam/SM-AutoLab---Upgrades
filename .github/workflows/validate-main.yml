# Validação contínua da aplicação.
name: Validate main for release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm-autolab-validate-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.7"

      - name: Validar versão e arquitetura consolidada
        shell: pwsh
        run: |
          python scripts/validate.py all
          if ($LASTEXITCODE -ne 0) { throw "Falha na validação consolidada." }

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validar sintaxe, testes e integração
        shell: pwsh
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "Falha de compilação sintática." }
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Falha nos testes automatizados." }
          python -c "from interface import App; from main import install_ui, _validar_base_aplicacao; install_ui(App); _validar_base_aplicacao(); print('Integracao consolidada: OK')"
          python scripts/smoke_ui.py

      - name: Verificar Defender
        shell: pwsh
        run: |
          Start-MpScan -ScanPath (Resolve-Path .) -ScanType CustomScan -ErrorAction Stop
          Start-Sleep -Seconds 5
          $threats = Get-MpThreatDetection
          if ($threats) { $threats | Format-List | Out-Host; throw "Windows Defender detectou ameaça na árvore validada." }
          Write-Host "Windows Defender: nenhuma detecção na árvore de código."
