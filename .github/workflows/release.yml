name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release (ex.: v2.99)"
        required: true
        default: "v2.99"
        type: string
  push:
    tags:
      - "v*.*.*"
      - "v*.*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Validate source and version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $tagVersion = $env:RELEASE_TAG.TrimStart('v')
          if ($v -ne $tagVersion) {
            throw "VERSION ($v) não corresponde à release ($env:RELEASE_TAG)."
          }

          $interface = Get-Content interface.py -Raw
          $required = @(
            'def _renderizar_calendario_arquivos',
            'Canvas(',
            'ARQUIVOS_DIAS = 60'
          )
          foreach ($marker in $required) {
            if ($interface -notlike "*$marker*") {
              throw "interface.py não contém o marcador esperado: $marker"
            }
          }
          if ($interface -match 'tkcalendar') {
            throw "interface.py ainda contém dependência tkcalendar."
          }
          if ($interface -match 'self\.abrir_historico_planilha\s*=\s*self\._abrir_historico_planilha_v266') {
            throw "patch_v266 ainda está sobrescrevendo abrir_historico_planilha."
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build SM AutoLab
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "SM AutoLab" --collect-submodules selenium --collect-data selenium --collect-data customtkinter --icon "SM AutoLab.ico" --add-data "SM AutoLab.ico;." --add-data "assets;assets" --add-data "VERSION;." main.py

      - name: Build updater
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "SM AutoLab Updater" updater.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/SM AutoLab.exe
            dist/SM AutoLab Updater.exe
