name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*.*"
      - "v*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag exata da release (ex.: vX.Y.Z ou vX.Y.Z.B)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout da tag exata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag && format('refs/tags/{0}', github.event.inputs.release_tag) || github.ref }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Confirmar que a tag corresponde à main atual
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          $mainCommit = (git rev-parse FETCH_HEAD).Trim()
          $tagCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $mainCommit) { throw "A tag deve apontar exatamente para o commit atual da main. Tag: $tagCommit; main: $mainCommit" }

      - name: Validar origem, versão e arquitetura
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.release_tag || github.ref_name }}"
          $tagVersion = $tag.TrimStart('vV')
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne $tagVersion) { throw "VERSION ($version) não corresponde à tag ($tag)." }
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw "VERSION inválida: $version" }

          $required = @(
            "main.py", "interface.py", "app.py", "automacao.py", "config.py", "atualizacao.py",
            "patch.py", "requirements.txt", "VERSION", "SM AutoLab.ico", "assets", "version_info_template.txt"
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Arquivo/recurso obrigatório ausente: $path" } }
          foreach ($legacyPath in @("ui_fixes_29912.py", "planilha.py", "resultados.py", "splash.py", "patch_base.py", "patch_arquivos.py", "patch_ajustes.py", "patch_v266.py", "patch_v267.py", "patch_v266_new.py", "updater.py", "patch_297.py", "patch_298.py", "patch_299.py", "patch_2991.py", "patch_29910.py", "patch_ui.py")) {
            if (Test-Path $legacyPath) { throw "Arquivo legado/consolidado ainda presente: $legacyPath" }
          }

          $main = Get-Content main.py -Raw
          $patch = Get-Content patch.py -Raw
          $interface = Get-Content interface.py -Raw
          $app = Get-Content app.py -Raw
          $atualizacao = Get-Content atualizacao.py -Raw
          if ($main -notlike "*from patch import aplicar_patch_ui*") { throw "main.py não usa o ponto único de integração patch.py." }
          if ($main -like "*from ui_fixes_29912 import*") { throw "main.py ainda referencia o módulo UI removido." }
          if ($main -notlike "*def install_ui_29912*") { throw "main.py não contém as correções finais de UI consolidadas." }
          if ($main -notlike "*class StartupSplash*") { throw "main.py não contém o splash consolidado." }
          if ($main -notlike "*_validar_base_aplicacao*") { throw "main.py perdeu a validação de integração." }
          if ($app -notlike "*class Resultados*") { throw "app.py não contém o módulo consolidado de resultados." }
          if ($app -notlike "*def carregar_codigos*") { throw "app.py não contém o leitor de planilhas consolidado." }
          foreach ($expected in @(
            "ARQUIVOS_COMPONENT_MARKER", "AJUSTES_COMPONENT_MARKER", "_SOURCE_PATCH_BASE", "_SOURCE_PATCH_ARQUIVOS", "_SOURCE_PATCH_AJUSTES",
            "_NS_PATCH_BASE", "_NS_PATCH_ARQUIVOS", "_NS_PATCH_AJUSTES",
            "PATCH_297_MARKER", "PATCH_298_MARKER", "PATCH_299_MARKER", "PATCH_2991_MARKER", "PATCH_29910_MARKER",
            "_historico_tem_erro", "_history_rebind_open_299", "_planilha_selecionar_tudo_2991", "_count_saved_passwords",
            "_atualizar_contador_selecao_29910", "_ensure_selection_state_29910", "_preencher_detalhe_pasta_297",
            "SM_AUTOLAB_UI_FIXES_29912", "_home_counter", "_calendar_click", "_create_history_tile", "_select_history_tile", "def install_ui_29912", "def aplicar_patch_ui"
          )) { if ($patch -notlike "*$expected*") { throw "patch.py não contém a funcionalidade consolidada: $expected" } }
          foreach ($legacyImport in @("from patch_base import", "from patch_arquivos import", "from patch_ajustes import", "from patch_297 import", "from patch_298 import", "from patch_299 import", "from patch_2991 import", "from patch_29910 import", "from patch_ui import", "from planilha import", "from resultados import", "from splash import", "from ui_fixes_29912 import")) {
            if ($main -like "*$legacyImport*" -or $interface -like "*$legacyImport*" -or $app -like "*$legacyImport*" -or $atualizacao -like "*$legacyImport*") { throw "Import legado detectado: $legacyImport" }
          }
          if ($patch -like "*Ctrl + clique para selecionar várias datas*") { throw "Instrução visual antiga ainda presente." }
          if ($interface -match "tkcalendar") { throw "Dependência tkcalendar detectada." }
          if ($interface -notlike "*from atualizacao import find_update, launch_updater*") { throw "Atualizador integrado não encontrado." }
          if ($atualizacao -notmatch 'def\s+find_update\s*\(' -or $atualizacao -notmatch 'def\s+launch_updater\s*\(') { throw "atualizacao.py não expõe o motor integrado." }
          if ($atualizacao -match 'SM[ ._]?AutoLab[ ._-]?Updater\.exe|updater\.py|--sm-autolab-updater|--sm-autolab-update-helper') { throw "Referência ao atualizador separado detectada." }

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.2

      - name: Validar sintaxe, testes e integração
        shell: pwsh
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "Falha na compilação sintática." }
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Falha nos testes automatizados." }
          python -c "from interface import App; from patch import aplicar_patch_ui; from main import _corrigir_historico_ilimitado, _validar_base_aplicacao, install_ui_29912; aplicar_patch_ui(App); _corrigir_historico_ilimitado(); install_ui_29912(App); _validar_base_aplicacao(); print('Integracao consolidada: OK')"

      - name: Preparar metadados do executável
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $parts = $version.Split('.')
          $metadata = Get-Content "version_info_template.txt" -Raw
          $build = if ($parts.Count -eq 4) { $parts[3] } else { "0" }
          $metadata = $metadata.Replace("__MAJOR__", $parts[0]).Replace("__MINOR__", $parts[1]).Replace("__PATCH__", $parts[2]).Replace("__BUILD__", $build).Replace("__VERSION__", $version)
          Set-Content -Path "version_info.txt" -Value $metadata -Encoding UTF8

      - name: Build SM AutoLab
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "SM AutoLab" --noupx --version-file "version_info.txt" --collect-submodules selenium --collect-data selenium --collect-data customtkinter --icon "SM AutoLab.ico" --add-data "SM AutoLab.ico;." --add-data "assets;assets" --add-data "VERSION;." main.py

      - name: Verificar executável com Microsoft Defender
        shell: pwsh
        run: |
          $main = (Resolve-Path "dist\SM AutoLab.exe").Path
          try { Start-MpScan -ScanPath $main -ScanType CustomScan -ErrorAction Stop } catch { throw "Não foi possível iniciar o Microsoft Defender: $($_.Exception.Message)" }
          Start-Sleep -Seconds 10
          $detections = Get-MpThreatDetection | Where-Object { $_.Resources -match [regex]::Escape($main) -or $_.Resources -match "SM AutoLab\.exe" }
          if ($detections) { $names = ($detections | ForEach-Object { $_.ThreatName } | Sort-Object -Unique) -join ", "; throw "Microsoft Defender detectou ameaça no executável gerado: $names" }
          Write-Host "Microsoft Defender: nenhuma detecção associada ao executável."

      - name: Validar executável e gerar manifesto
        shell: pwsh
        run: |
          $main = "dist\SM AutoLab.exe"
          if (-not (Test-Path $main)) { throw "Executável principal não foi gerado." }
          if ((Get-Item $main).Length -lt 1000000) { throw "Executável principal suspeitamente pequeno." }
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "${{ github.event.inputs.release_tag || github.ref_name }}"
          $mainSha256 = (Get-FileHash -Algorithm SHA256 $main).Hash.ToLower()
          $manifest = @{ channel = "SM-AUTOLAB-RESET-2026-09"; version = $version; tag = $tag; commit = "${{ github.sha }}"; main_asset = "SM AutoLab.exe"; main_sha256 = $mainSha256 } | ConvertTo-Json -Compress
          Set-Content -Path "SM AutoLab Release Manifest.json" -Value $manifest -Encoding UTF8

      - name: Anexar arquivos à GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/SM AutoLab.exe
            SM AutoLab Release Manifest.json

      - name: Verificar artefatos efetivamente publicados
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.release_tag || github.ref_name }}"
          $headers = @{ Accept = "application/vnd.github+json"; Authorization = "Bearer $env:GITHUB_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28" }
          $apiRoot = "https://api.github.com/repos/${{ github.repository }}"
          $release = Invoke-RestMethod -Uri "$apiRoot/releases/tags/$tag" -Headers $headers
          $commit = (Invoke-RestMethod -Uri "$apiRoot/commits/$tag" -Headers $headers).sha
          if ($commit -ne "${{ github.sha }}") { throw "A release publicada não aponta para o commit executado." }

          function Normalize-AssetName([string]$value) { return (($value ?? "").Trim().ToLower() -replace '[\s._-]+', '') }
          $assets = @($release.assets)
          $exe = $assets | Where-Object { (Normalize-AssetName $_.name) -eq (Normalize-AssetName 'SM AutoLab.exe') } | Select-Object -First 1
          $manifestAsset = $assets | Where-Object { (Normalize-AssetName $_.name) -eq (Normalize-AssetName 'SM AutoLab Release Manifest.json') } | Select-Object -First 1
          if (-not $exe) { throw "Executável não encontrado na release publicada." }
          if (-not $manifestAsset) { throw "Manifesto não encontrado na release publicada." }

          $assetDigest = [string]$exe.digest
          if ($assetDigest.ToLower().StartsWith('sha256:')) { $assetDigest = $assetDigest.Substring(7) }
          if (-not $assetDigest) { throw "GitHub não forneceu o SHA-256 do executável publicado." }

          $manifestPath = Join-Path $env:RUNNER_TEMP "SM AutoLab Release Manifest.json"
          Invoke-WebRequest -Uri "$apiRoot/releases/assets/$($manifestAsset.id)" -Headers @{ Accept = "application/octet-stream"; Authorization = "Bearer $env:GITHUB_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28" } -OutFile $manifestPath -UseBasicParsing
          $publishedManifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ([string]$publishedManifest.channel -ne 'SM-AUTOLAB-RESET-2026-09') { throw "Canal inválido no manifesto publicado." }
          if ([string]$publishedManifest.version -ne [string]$release.tag_name.TrimStart('v','V')) { throw "Versão do manifesto não corresponde à release." }
          if ([string]$publishedManifest.tag -ne [string]$release.tag_name) { throw "Tag do manifesto não corresponde à release." }
          if ([string]$publishedManifest.commit -ne [string]$commit) { throw "Commit do manifesto não corresponde à tag publicada." }
          if ((Normalize-AssetName([string]$publishedManifest.main_asset)) -ne (Normalize-AssetName([string]$exe.name))) { throw "Nome do executável no manifesto diverge do asset publicado." }
          if ([string]$publishedManifest.main_sha256 -ne [string]$assetDigest) { throw "SHA-256 do manifesto diverge do SHA-256 do asset publicado." }

          $assetsNormalized = $assets | ForEach-Object { Normalize-AssetName $_.name }
          if (($assetsNormalized | Where-Object { $_ -eq (Normalize-AssetName 'SM AutoLab Updater.exe') }).Count -gt 0) { throw "Atualizador separado foi publicado." }
          Write-Host "Validação remota da release: OK"
