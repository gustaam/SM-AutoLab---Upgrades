name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag exata da release (ex.: v2.99.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout da tag exata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag && format('refs/tags/{0}', github.event.inputs.release_tag) || github.ref }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Validar origem, versão e componentes obrigatórios
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.release_tag || github.ref_name }}"
          $tagVersion = $tag.TrimStart('vV')
          $version = (Get-Content VERSION -Raw).Trim()

          if ($version -ne $tagVersion) {
            throw "VERSION ($version) não corresponde à tag ($tag). Release cancelada para impedir publicação de código de outra versão."
          }

          $required = @(
            "main.py",
            "interface.py",
            "app.py",
            "automacao.py",
            "config.py",
            "planilha.py",
            "resultados.py",
            "splash.py",
            "updater.py",
            "patch_v266.py",
            "patch_v267.py",
            "requirements.txt",
            "VERSION",
            "SM AutoLab.ico",
            "assets"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Arquivo/recurso obrigatório ausente: $path"
            }
          }

          $interface = Get-Content interface.py -Raw
          $patch267 = Get-Content patch_v267.py -Raw
          $main = Get-Content main.py -Raw
          $updater = Get-Content updater.py -Raw

          if ($interface -notmatch "Canvas\(") {
            throw "interface.py não contém o calendário Canvas esperado."
          }
          if ($interface -match "tkcalendar") {
            throw "Dependência tkcalendar detectada; build interrompido para proteger a versão-base."
          }

          $markers = @(
            "_toggle_modo_selecao_arquivos",
            "_toggle_data_selecionada",
            "_apagar_datas_selecionadas",
            "_atualizar_contador_selecao",
            "_renderizar_calendario_arquivos",
            "_contar_codigos_mes_v267"
          )
          foreach ($marker in $markers) {
            if ($patch267 -notlike "*$marker*") {
              throw "patch_v267.py não contém o componente obrigatório: $marker"
            }
          }

          if ($main -notmatch "aplicar_patch\(App\)") {
            throw "main.py não aplica o patch legado obrigatório."
          }
          if ($main -notmatch "aplicar_patch_v267\(App\)") {
            throw "main.py não aplica o patch v267 obrigatório."
          }
          $mainMethods = @(
            "abrir_historico_planilha",
            "_renderizar_calendario_arquivos",
            "_toggle_modo_selecao_arquivos",
            "_toggle_data_selecionada",
            "_apagar_datas_selecionadas",
            "_atualizar_contador_selecao",
            "_contar_codigos_mes"
          )
          if ($main -notmatch "_REQUIRED_BASE_METHODS") {
            throw "main.py não contém a validação de integridade da base."
          }
          if ($updater -notmatch "SM AutoLab Updater\.exe" -or $updater -notmatch "SM\.AutoLab Updater\.exe" -or $updater -notmatch "SM\.AutoLab\.Updater\.exe") {
            throw "updater.py não reconhece todas as nomenclaturas obrigatórias."
          }

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Validar sintaxe Python
        shell: pwsh
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) {
            throw "Falha na compilação sintática dos arquivos Python."
          }

      - name: Recusar sobrescrita de release existente
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.inputs.release_tag || github.ref_name }}"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $uri = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          try {
            $response = Invoke-WebRequest -Uri $uri -Headers $headers -Method Get -SkipHttpErrorCheck
            if ($response.StatusCode -eq 200) {
              throw "A release $tag já existe. O workflow não sobrescreve releases existentes. Crie uma nova versão/tag."
            }
          } catch {
            if ($_.Exception.Message -like "*já existe*") { throw }
          }

      - name: Build SM AutoLab
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "SM AutoLab" --collect-submodules selenium --collect-data selenium --collect-data customtkinter --icon "SM AutoLab.ico" --add-data "SM AutoLab.ico;." --add-data "assets;assets" --add-data "VERSION;." main.py

      - name: Build updater
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "SM AutoLab Updater" updater.py

      - name: Validar executáveis e gerar manifesto
        shell: pwsh
        run: |
          $main = "dist\SM AutoLab.exe"
          $updater = "dist\SM AutoLab Updater.exe"
          if (-not (Test-Path $main)) { throw "Executável principal não foi gerado: $main" }
          if (-not (Test-Path $updater)) { throw "Updater não foi gerado: $updater" }
          if ((Get-Item $main).Length -lt 1000000) { throw "Executável principal suspeitamente pequeno." }
          if ((Get-Item $updater).Length -lt 1000000) { throw "Updater suspeitamente pequeno." }

          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "${{ github.event.inputs.release_tag || github.ref_name }}"
          $manifest = @{
            channel = "SM-AUTOLAB-RESET-2026-09"
            version = $version
            tag = $tag
            commit = "${{ github.sha }}"
            main_asset = "SM AutoLab.exe"
            updater_asset = "SM AutoLab Updater.exe"
          } | ConvertTo-Json -Compress
          Set-Content -Path "SM AutoLab Release Manifest.json" -Value $manifest -Encoding UTF8

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: "<!-- SM-AUTOLAB-RESET-2026-09 -->"
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            dist/SM AutoLab.exe
            dist/SM AutoLab Updater.exe
            SM AutoLab Release Manifest.json
