# Build e publicação das releases.
name: Build and publish release

on:
  workflow_run:
    workflows:
      - "Validate main for release"
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag exata da release (ex.: vX.Y.Z ou vX.Y.Z.B)"
        required: true
        type: string

permissions: {}

concurrency:
  group: sm-autolab-release-${{ github.event.inputs.release_tag || github.event.workflow_run.head_sha || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout da tag exata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || format('refs/tags/{0}', github.event.inputs.release_tag) }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolver contexto da release
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_run") {
            $version = (Get-Content VERSION -Raw).Trim()
            if (-not $version) { throw "VERSION vazia." }
            $tag = "v$version"
          } else {
            $tag = "${{ github.event.inputs.release_tag }}"
          }
          if (-not $tag) { throw "Não foi possível determinar a tag da release." }
          $expectedCommit = if ($env:GITHUB_EVENT_NAME -eq "workflow_run") { "${{ github.event.workflow_run.head_sha }}" } else { (git rev-parse HEAD).Trim() }
          if (-not $expectedCommit) { throw "Não foi possível determinar o commit esperado da release." }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXPECTED_COMMIT=$expectedCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verificar se a release automática já foi publicada
        id: release_state
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $headers = @{ Accept = "application/vnd.github+json"; Authorization = "Bearer $env:GITHUB_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28" }
          $apiRoot = "https://api.github.com/repos/${{ github.repository }}"
          $valid = $false
          try {
            $release = Invoke-RestMethod -Uri "$apiRoot/releases/tags/$tag" -Headers $headers
            $tagCommit = (Invoke-RestMethod -Uri "$apiRoot/commits/$tag" -Headers $headers).sha
            $assets = @($release.assets)
            function Normalize-AssetName([string]$value) { return (($value ?? "").Trim().ToLower() -replace '[\s._-]+', '') }
            $exe = $assets | Where-Object { (Normalize-AssetName $_.name) -eq (Normalize-AssetName 'SM AutoLab.exe') } | Select-Object -First 1
            $manifestAsset = $assets | Where-Object { (Normalize-AssetName $_.name) -eq (Normalize-AssetName 'SM AutoLab Release Manifest.json') } | Select-Object -First 1
            if ($release.draft -eq $false -and $release.prerelease -eq $false -and $tagCommit -and $exe -and $manifestAsset) {
              $manifestPath = Join-Path $env:RUNNER_TEMP "existing-release-manifest.json"
              Invoke-WebRequest -Uri "$apiRoot/releases/assets/$($manifestAsset.id)" -Headers @{ Accept = "application/octet-stream"; Authorization = "Bearer $env:GITHUB_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28" } -OutFile $manifestPath -UseBasicParsing
              $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
              $assetDigest = [string]$exe.digest
              if ($assetDigest.ToLower().StartsWith('sha256:')) { $assetDigest = $assetDigest.Substring(7) }
              $version = $tag.TrimStart('v','V')
              $valid = (
                [string]$manifest.channel -eq 'SM-AUTOLAB-RESET-2026-09' -and
                [string]$manifest.version -eq $version -and
                [string]$manifest.tag -eq $tag -and
                [string]$manifest.commit -eq $tagCommit -and
                [string]$manifest.main_asset -eq 'SM AutoLab.exe' -and
                [string]$manifest.main_sha256 -eq $assetDigest -and
                -not (@($assets | Where-Object { (Normalize-AssetName $_.name) -eq (Normalize-AssetName 'SM AutoLab Updater.exe') }).Count -gt 0)
              )
            }
            if ($valid) {
              if ($env:GITHUB_EVENT_NAME -eq "workflow_run") {
                "already_published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                "repair=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                Write-Host "A release $tag já está publicada e íntegra. A execução automática será encerrada sem republicar a versão."
              } else {
                "already_published=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                "repair=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                Write-Host "A release $tag já existe e está íntegra, mas a execução foi manual; a reconstrução será permitida."
              }
            } else {
              "already_published=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "repair=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Host "A release $tag existe, mas está ausente ou inconsistente. A execução será usada para repará-la a partir da própria tag."
            }
          } catch {
            $status = [int]$_.Exception.Response.StatusCode
            if ($status -eq 404) {
              "already_published=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "repair=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Host "A release $tag ainda não está publicada."
            } else {
              throw
            }
          }

      - name: Encerrar execução automática sem republicar
        if: steps.release_state.outputs.already_published == 'true'
        shell: pwsh
        run: |
          Write-Host "Release $env:RELEASE_TAG já publicada e validada; nenhuma reconstrução ou alteração será realizada."

      - name: Selecionar commit da tag para reparo
        if: steps.release_state.outputs.repair == 'true'
        shell: pwsh
        run: |
          git fetch origin "refs/tags/$($env:RELEASE_TAG):refs/tags/$($env:RELEASE_TAG)" --force
          git checkout --detach "refs/tags/$($env:RELEASE_TAG)"
          $tagCommit = (git rev-parse "refs/tags/$($env:RELEASE_TAG)^{commit}").Trim()
          "EXPECTED_COMMIT=$tagCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Reparo da release baseado na tag $env:RELEASE_TAG -> $tagCommit."

      - name: Setup Python
        if: steps.release_state.outputs.already_published != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.7"

      - name: Confirmar que a tag corresponde ao commit da release
        if: steps.release_state.outputs.already_published != 'true'
        shell: pwsh
        run: |
          git fetch origin "refs/tags/$($env:RELEASE_TAG):refs/tags/$($env:RELEASE_TAG)" --force
          $tagCommit = (git rev-parse "refs/tags/$($env:RELEASE_TAG)^{commit}").Trim()
          $expectedCommit = $env:EXPECTED_COMMIT
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $expectedCommit) { throw "A tag não aponta para o commit esperado da release. Tag: $tagCommit; esperado: $expectedCommit" }
          if ($headCommit -ne $expectedCommit) { throw "O checkout não corresponde ao commit esperado da release. HEAD: $headCommit; esperado: $expectedCommit" }

      - name: Validar tag, versão e arquitetura consolidada
        if: steps.release_state.outputs.already_published != 'true'
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $tagVersion = $tag.TrimStart('vV')
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne $tagVersion) { throw "VERSION ($version) não corresponde à tag ($tag)." }
          python scripts/validate.py all
          if ($LASTEXITCODE -ne 0) { throw "Falha na validação consolidada." }

      - name: Instalar dependências
        if: steps.release_state.outputs.already_published != 'true'
        shell: pwsh
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pip install pyinstaller==6.22.3

      - name: Validar sintaxe, testes e integração
        if: steps.release_state.outputs.already_published != 'true'
        shell: pwsh
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw "Falha na compilação sintática." }
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Falha nos testes automatizados." }
          python -c "from interface import App; from main import install_ui, _validar_base_aplicacao; install_ui(App); _validar_base_aplicacao(); print('Integracao consolidada: OK')"
          python scripts/smoke_ui.py

      - name: Validar build e preparar metadados
        if: steps.release_state.outputs.already_published != 'true'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $parts = $version.Split('.')
          if ($parts.Count -lt 3 -or $parts.Count -gt 4) { throw "VERSION inválida: $version" }
          $build = if ($parts.Count -eq 4) { $parts[3] } else { "0" }
          $metadata = [string]::Join([Environment]::NewLine,@(
            'VSVersionInfo(',
            '  ffi=FixedFileInfo(',
            '    filevers=(__MAJOR__, __MINOR__, __PATCH__, __BUILD__),',
            '    prodvers=(__MAJOR__, __MINOR__, __PATCH__, __BUILD__),',
            '    mask=0x3f,',
            '    flags=0x0,',
            '    OS=0x40004,',
            '    fileType=0x1,',
            '    subtype=0x0,',
            '    date=(0, 0)',
            '  ),',
            '  kids=[',
            '    StringFileInfo([',
            '      StringTable(''040904B0'', [',
            '        StringStruct(''CompanyName'', ''SM AutoLab''),',
            '        StringStruct(''FileDescription'', ''SM AutoLab — Automação de autorizações no Feegow''),',
            '        StringStruct(''FileVersion'', ''__VERSION__''),',
            '        StringStruct(''InternalName'', ''SM AutoLab''),',
            '        StringStruct(''OriginalFilename'', ''SM AutoLab.exe''),',
            '        StringStruct(''ProductName'', ''SM AutoLab''),',
            '        StringStruct(''ProductVersion'', ''__VERSION__'')',
            '      ])',
            '    ]),',
            '    VarFileInfo([VarStruct(''Translation'', [1033, 1200])])',
            '  ]',
            ')'
          ))
          $metadata = $metadata.Replace('__MAJOR__',$parts[0]).Replace('__MINOR__',$parts[1]).Replace('__PATCH__',$parts[2]).Replace('__BUILD__',$build).Replace('__VERSION__',$version)
          Set-Content -Path "version_info.txt" -Value $metadata -Encoding UTF8

      - name: Build SM AutoLab
        if: steps.release_state.outputs.already_published != 'true'
        shell: cmd
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "SM AutoLab" --noupx --version-file "version_info.txt" --collect-submodules selenium --collect-data selenium --collect-data customtkinter --icon "SM AutoLab.ico" --add-data "SM AutoLab.ico;." --add-data "assets;assets" --add-data "VERSION;." main.py

      - name: Validar estrutura e metadados do executável
        if: steps.release_state.outputs.already_published != 'true'
        shell: pwsh
        run: |
          python scripts/validate.py executable "dist\SM AutoLab.exe"
          if ($LASTEXITCODE -ne 0) { throw "Falha na validação estrutural do executável." }
          $version = (Get-Content VERSION -Raw).Trim()
          $info = (Get-Item "dist\SM AutoLab.exe").VersionInfo
          if ([string]$info.ProductName -ne "SM AutoLab") { throw "ProductName inválido: $($info.ProductName)" }
          if ([string]$info.ProductVersion -ne $version) { throw "ProductVersion ($($info.ProductVersion)) não corresponde a VERSION ($version)." }

      - name: Verificar executável com Microsoft Defender
        if: steps.release_state.outputs.already_published != 'true'
        shell: pwsh
        run: |
          $main = (Resolve-Path "dist\SM AutoLab.exe").Path
          Start-MpScan -ScanPath $main -ScanType CustomScan -ErrorAction Stop
          Start-Sleep -Seconds 10
          $detections = Get-MpThreatDetection | Where-Object { $_.Resources -match [regex]::Escape($main) -or $_.Resources -match "SM AutoLab\.exe" }
          if ($detections) { $names = ($detections | ForEach-Object { $_.ThreatName } | Sort-Object -Unique) -join ", "; throw "Microsoft Defender detectou ameaça no executável gerado: $names" }
          Write-Host "Microsoft Defender: nenhuma detecção associada ao executável."

      - name: Gerar manifesto da release
        if: steps.release_state.outputs.already_published != 'true'
        shell: pwsh
        run: |
          $main = "dist\SM AutoLab.exe"
          if (-not (Test-Path $main)) { throw "Executável principal não foi gerado." }
          if ((Get-Item $main).Length -lt 1000000) { throw "Executável principal suspeitamente pequeno." }
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = $env:RELEASE_TAG
          $mainSha256 = (Get-FileHash -Algorithm SHA256 $main).Hash.ToLower()
          $manifest = @{ channel = "SM-AUTOLAB-RESET-2026-09"; version = $version; tag = $tag; commit = $env:EXPECTED_COMMIT; main_asset = "SM AutoLab.exe"; main_sha256 = $mainSha256 } | ConvertTo-Json -Compress
          Set-Content -Path "SM AutoLab Release Manifest.json" -Value $manifest -Encoding UTF8

      - name: Anexar arquivos à GitHub Release
        if: steps.release_state.outputs.already_published != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/SM AutoLab.exe
            SM AutoLab Release Manifest.json

      - name: Verificar artefatos efetivamente publicados
        if: steps.release_state.outputs.already_published != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $headers = @{ Accept = "application/vnd.github+json"; Authorization = "Bearer $env:GITHUB_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28" }
          $apiRoot = "https://api.github.com/repos/${{ github.repository }}"
          $release = Invoke-RestMethod -Uri "$apiRoot/releases/tags/$tag" -Headers $headers
          $commit = (Invoke-RestMethod -Uri "$apiRoot/commits/$tag" -Headers $headers).sha
          if ($commit -ne $env:EXPECTED_COMMIT) { throw "A release publicada não aponta para o commit esperado da execução." }
          function Normalize-AssetName([string]$value) { return (($value ?? "").Trim().ToLower() -replace '[\s._-]+', '') }
          $assets = @($release.assets)
          $exe = $assets | Where-Object { (Normalize-AssetName $_.name) -eq (Normalize-AssetName 'SM AutoLab.exe') } | Select-Object -First 1
          $manifestAsset = $assets | Where-Object { (Normalize-AssetName $_.name) -eq (Normalize-AssetName 'SM AutoLab Release Manifest.json') } | Select-Object -First 1
          if (-not $exe) { throw "Executável não encontrado na release publicada." }
          if (-not $manifestAsset) { throw "Manifesto não encontrado na release publicada." }
          $assetDigest = [string]$exe.digest
          if ($assetDigest.ToLower().StartsWith('sha256:')) { $assetDigest = $assetDigest.Substring(7) }
          if (-not $assetDigest) { throw "GitHub não forneceu o SHA-256 do executável publicado." }
          $manifestPath = Join-Path $env:RUNNER_TEMP "SM AutoLab Release Manifest.json"
          Invoke-WebRequest -Uri "$apiRoot/releases/assets/$($manifestAsset.id)" -Headers @{ Accept = "application/octet-stream"; Authorization = "Bearer $env:GITHUB_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28" } -OutFile $manifestPath -UseBasicParsing
          $publishedManifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ([string]$publishedManifest.channel -ne 'SM-AUTOLAB-RESET-2026-09') { throw "Canal inválido no manifesto publicado." }
          if ([string]$publishedManifest.version -ne [string]$release.tag_name.TrimStart('v','V')) { throw "Versão do manifesto não corresponde à release." }
          if ([string]$publishedManifest.tag -ne [string]$release.tag_name) { throw "Tag do manifesto não corresponde à release." }
          if ([string]$publishedManifest.commit -ne [string]$commit) { throw "Commit do manifesto não corresponde à tag publicada." }
          if ((Normalize-AssetName([string]$publishedManifest.main_asset)) -ne (Normalize-AssetName([string]$exe.name))) { throw "Nome do executável no manifesto diverge do asset publicado." }
          if ([string]$publishedManifest.main_sha256 -ne [string]$assetDigest) { throw "SHA-256 do manifesto diverge do SHA-256 do asset publicado." }
          if (@($assets | Where-Object { (Normalize-AssetName $_.name) -eq (Normalize-AssetName 'SM AutoLab Updater.exe') }).Count -gt 0) { throw "Atualizador separado foi publicado." }
          Write-Host "Validação remota da release: OK"
